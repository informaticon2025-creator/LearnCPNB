<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de artículos - COPP</title>
  <link rel="stylesheet" href="style/css.css">
  <script src="interaction/art.js" defer></script>
</head>
<body>
  <main class="article-page">
    <header class="site-header article-page-header">
      <a class="article-back-link" href="index.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="m15 18-6-6 6-6M9 12h11"></path>
        </svg>
        <span></span>
      </a>
      <h1>Buscador de artículos del COPP</h1>
    </header>

    <section class="article-search-panel" aria-label="Buscar artículos del COPP">
      <label for="articleSearch">Escribe el título o número del artículo</label>
      <div class="article-search-box">
        <svg class="icon article-search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="10.8" cy="10.8" r="6.8"></circle>
          <path d="m16 16 4.5 4.5"></path>
        </svg>
        <input id="articleSearch" type="search" placeholder="Ej.: 126 o Imputado" autocomplete="off">
      </div>
      <p class="article-search-help">Los resultados muestran el texto del artículo según el documento COPP.</p>
      <p class="article-search-status" id="articleSearchStatus" role="status" aria-live="polite">Cargando artículos...</p>
    </section>

    <section class="article-results" id="articleResults" aria-label="Resultados de artículos" aria-live="polite"></section>
  </main>
</body>
</html>
